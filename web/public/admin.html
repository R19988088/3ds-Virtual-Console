<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vcoven admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #f0f6fc; }
  h2 { font-size: 15px; font-weight: 600; color: #8b949e; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .stat .val { font-size: 28px; font-weight: 700; color: #58a6ff; }
  .stat .val.error { color: #f85149; }
  .stat .label { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #8b949e; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #21262d; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .pill.success { background: #1a472a; color: #3fb950; }
  .pill.err { background: #3b1e1e; color: #f85149; }
  .pill.android { background: #1a472a; color: #3fb950; }
  .pill.ios { background: #1c2541; color: #58a6ff; }
  .pill.windows { background: #2d1b4e; color: #bc8cff; }
  .pill.mac { background: #3b2b1a; color: #d29922; }
  .pill.other { background: #21262d; color: #8b949e; }
  .size { color: #8b949e; }
  .time { color: #8b949e; font-size: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-bottom: 8px; }
  .bar { background: #58a6ff; border-radius: 2px 2px 0 0; min-width: 20px; flex: 1; transition: height 0.3s; }
  .bar:hover { background: #79c0ff; }
  .chart-labels { display: flex; gap: 3px; font-size: 10px; color: #484f58; }
  .chart-labels span { flex: 1; min-width: 20px; text-align: center; }
  .empty { color: #484f58; font-style: italic; padding: 12px; }
  .refresh { background: none; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; float: right; }
  .refresh:hover { border-color: #58a6ff; color: #58a6ff; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .dl-link { font-size: 11px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; color: #8b949e; background: none; border: 1px solid #30363d; }
  .tab.active { background: #21262d; color: #f0f6fc; border-color: #58a6ff; }
</style>
</head>
<body>

<h1>vcoven dashboard <button class="refresh" onclick="loadAll()">refresh</button></h1>

<div class="stats" id="stat-cards"></div>

<div class="section">
  <h2>builds over time</h2>
  <div class="chart" id="chart"></div>
  <div class="chart-labels" id="chart-labels"></div>
</div>

<div class="section">
  <h2>build log</h2>
  <div class="tabs" id="build-tabs">
    <div class="tab active" data-filter="all" onclick="filterBuilds('all', this)">all</div>
    <div class="tab" data-filter="success" onclick="filterBuilds('success', this)">success</div>
    <div class="tab" data-filter="error" onclick="filterBuilds('error', this)">errors</div>
  </div>
  <table>
    <thead><tr><th>status</th><th>rom</th><th>title</th><th>save</th><th>size</th><th>platform</th><th>link</th><th>time</th></tr></thead>
    <tbody id="builds-table"></tbody>
  </table>
</div>

<div class="section">
  <h2>platforms</h2>
  <table>
    <thead><tr><th>platform</th><th>builds</th><th>errors</th></tr></thead>
    <tbody id="platform-table"></tbody>
  </table>
</div>

<div class="section">
  <h2>repeated builds</h2>
  <p style="font-size:12px;color:#484f58;margin-bottom:8px;">ROMs built more than once (same filename)</p>
  <table>
    <thead><tr><th>rom</th><th>count</th><th>users</th><th>errors</th></tr></thead>
    <tbody id="repeats-table"></tbody>
  </table>
</div>

<div class="section">
  <h2>feedback</h2>
  <div id="feedback-list"></div>
</div>

<script>
const API = 'https://vcoven-api-5940458611.us-central1.run.app'
const FB_API = 'https://firestore.googleapis.com/v1/projects/vcoven-web/databases/(default)/documents'
const FB_KEY = 'AIzaSyCioXpCJN2d2cJobdox8k3KuTc7hwMrmfo'

let allBuilds = []
let currentFilter = 'all'

function fs(fields, key) {
  const f = fields[key]
  if (!f) return ''
  return f.stringValue || f.integerValue || f.doubleValue || (f.booleanValue !== undefined ? f.booleanValue : '') || ''
}

function parsePlatform(ua) {
  if (!ua) return 'other'
  if (/Android/i.test(ua)) return 'android'
  if (/iPhone|iPad/i.test(ua)) return 'ios'
  if (/Windows/i.test(ua)) return 'windows'
  if (/Macintosh|Mac OS/i.test(ua)) return 'mac'
  return 'other'
}

function fmtSize(bytes) {
  bytes = Number(bytes)
  if (!bytes) return '—'
  if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB'
  return (bytes/1024).toFixed(0) + ' KB'
}

function fmtTime(iso) {
  if (!iso) return ''
  const d = new Date(iso)
  const now = new Date()
  const diff = (now - d) / 1000
  if (diff < 60) return 'just now'
  if (diff < 3600) return Math.floor(diff/60) + 'm ago'
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago'
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
}

async function fetchAllBuilds() {
  // Paginate through every build doc so detail stats (unique ROMs, success/error
  // counts) reflect all time, not just the first page.
  const docs = []
  let pageToken = ''
  for (let i = 0; i < 50; i++) {  // hard cap: 50 pages * 300 = 15000 docs
    const params = new URLSearchParams({ key: FB_KEY, pageSize: '300', orderBy: 'timestamp desc' })
    if (pageToken) params.set('pageToken', pageToken)
    const res = await fetch(`${FB_API}/builds?${params}`)
    if (!res.ok) break
    const data = await res.json()
    if (data.documents) docs.push(...data.documents)
    if (!data.nextPageToken) break
    pageToken = data.nextPageToken
  }
  return docs
}

async function loadAll() {
  try {
    const [statsRes, feedbackRes, buildDocs] = await Promise.all([
      fetch(`${API}/admin/stats`),
      fetch(`${FB_API}/feedback?key=${FB_KEY}`),
      fetchAllBuilds(),
    ])

    const stats = statsRes.ok ? await statsRes.json() : { total_builds: 0, today_builds: 0, total_size_mb: 0, builds: [] }
    const fbData = await feedbackRes.json().catch(() => ({}))

    const fsDocs = (buildDocs || []).map(d => {
      const f = d.fields || {}
      return {
        status: fs(f, 'status'),
        romName: fs(f, 'romName'),
        romSize: Number(fs(f, 'romSize')) || 0,
        title: fs(f, 'title'),
        titleId: fs(f, 'titleId'),
        saveType: fs(f, 'saveType'),
        qr: fs(f, 'qr'),
        outputFile: fs(f, 'outputFile'),
        outputSize: Number(fs(f, 'outputSize')) || 0,
        downloadUrl: fs(f, 'downloadUrl'),
        error: fs(f, 'error'),
        userAgent: fs(f, 'userAgent'),
        platform: parsePlatform(fs(f, 'userAgent')),
        timestamp: f.timestamp?.timestampValue || '',
      }
    }).sort((a, b) => b.timestamp.localeCompare(a.timestamp))

    allBuilds = fsDocs

    renderStats(stats, fsDocs)
    renderChart(stats.builds)
    renderBuilds(fsDocs)
    renderPlatforms(fsDocs)
    renderRepeats(fsDocs)
    renderFeedback(fbData.documents || [])
  } catch (e) {
    console.error(e)
  }
}

function renderStats(gcsStats, fsDocs) {
  const successCount = fsDocs.filter(b => b.status === 'success').length
  const errorCount = fsDocs.filter(b => b.status === 'error').length
  const uniqueRoms = new Set(fsDocs.filter(b => b.romName).map(b => b.romName)).size
  const platforms = new Set(fsDocs.map(b => b.platform)).size

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat"><div class="val">${gcsStats.total_builds}</div><div class="label">total builds</div></div>
    <div class="stat"><div class="val">${gcsStats.today_builds}</div><div class="label">today</div></div>
    <div class="stat"><div class="val">${successCount}</div><div class="label">success</div></div>
    <div class="stat"><div class="val error">${errorCount}</div><div class="label">errors</div></div>
    <div class="stat"><div class="val">${uniqueRoms}</div><div class="label">unique ROMs</div></div>
    <div class="stat"><div class="val">${gcsStats.total_size_mb}</div><div class="label">total MB built</div></div>
  `
}

function renderBuilds(builds) {
  const filtered = currentFilter === 'all' ? builds : builds.filter(b => b.status === currentFilter)
  const tbody = document.getElementById('builds-table')
  if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty">no builds</td></tr>'; return }
  tbody.innerHTML = filtered.slice(0, 100).map(b => `
    <tr>
      <td><span class="pill ${b.status === 'success' ? 'success' : 'err'}">${b.status}</span></td>
      <td title="${b.romName}">${b.romName || '—'}</td>
      <td title="${b.title}">${b.title || '—'}</td>
      <td>${b.saveType || '—'}</td>
      <td class="size">${fmtSize(b.romSize || b.outputSize)}</td>
      <td><span class="pill ${b.platform}">${b.platform}</span></td>
      <td>${b.downloadUrl ? `<a href="${b.downloadUrl}" class="dl-link" target="_blank">${b.qr ? 'QR' : 'DL'}</a>` : (b.error ? `<span class="pill err" title="${b.error}">err</span>` : '—')}</td>
      <td class="time" title="${b.timestamp}">${fmtTime(b.timestamp)}</td>
    </tr>
  `).join('')
}

function filterBuilds(filter, el) {
  currentFilter = filter
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  renderBuilds(allBuilds)
}

function renderChart(builds) {
  const days = {}
  builds.forEach(b => {
    if (!b.created) return
    const day = b.created.slice(0, 10)
    days[day] = (days[day] || 0) + 1
  })
  const sorted = Object.entries(days).sort((a,b) => a[0].localeCompare(b[0]))
  if (!sorted.length) return
  const first = new Date(sorted[0][0])
  const last = new Date()
  const allDays = []
  for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
    const key = d.toISOString().slice(0, 10)
    allDays.push([key, days[key] || 0])
  }
  const max = Math.max(...allDays.map(d => d[1]), 1)
  document.getElementById('chart').innerHTML = allDays.map(([day, count]) =>
    `<div class="bar" style="height: ${Math.max(count/max*100, count ? 4 : 0)}%" title="${day}: ${count} builds"></div>`
  ).join('')
  document.getElementById('chart-labels').innerHTML = allDays.map(([day]) =>
    `<span>${day.slice(8)}</span>`
  ).join('')
}

function renderPlatforms(builds) {
  const platforms = {}
  builds.forEach(b => {
    const p = b.platform
    if (!platforms[p]) platforms[p] = { total: 0, errors: 0 }
    platforms[p].total++
    if (b.status === 'error') platforms[p].errors++
  })
  const tbody = document.getElementById('platform-table')
  const sorted = Object.entries(platforms).sort((a,b) => b[1].total - a[1].total)
  tbody.innerHTML = sorted.map(([p, d]) => `
    <tr>
      <td><span class="pill ${p}">${p}</span></td>
      <td>${d.total}</td>
      <td>${d.errors ? `<span class="pill err">${d.errors}</span>` : '0'}</td>
    </tr>
  `).join('')
}

function renderRepeats(builds) {
  const byRom = {}
  builds.forEach(b => {
    if (!b.romName) return
    if (!byRom[b.romName]) byRom[b.romName] = { count: 0, errors: 0, platforms: new Set() }
    byRom[b.romName].count++
    byRom[b.romName].platforms.add(b.platform)
    if (b.status === 'error') byRom[b.romName].errors++
  })
  const repeats = Object.entries(byRom).filter(([_, d]) => d.count > 1).sort((a,b) => b[1].count - a[1].count)
  const tbody = document.getElementById('repeats-table')
  if (!repeats.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">no repeated builds yet</td></tr>'; return }
  tbody.innerHTML = repeats.map(([name, d]) => `
    <tr>
      <td title="${name}">${name}</td>
      <td>${d.count}</td>
      <td>${[...d.platforms].map(p => `<span class="pill ${p}">${p}</span>`).join(' ')}</td>
      <td>${d.errors ? `<span class="pill err">${d.errors}</span>` : '0'}</td>
    </tr>
  `).join('')
}

function renderFeedback(docs) {
  const el = document.getElementById('feedback-list')
  if (!docs.length) { el.innerHTML = '<div class="empty">no feedback yet</div>'; return }
  el.innerHTML = docs.map(d => {
    const f = d.fields || {}
    const msg = f.text?.stringValue || f.message?.stringValue || ''
    const email = f.email?.stringValue || ''
    const type = f.type?.stringValue || ''
    const ts = f.timestamp?.timestampValue || ''
    const ua = f.userAgent?.stringValue || ''
    const platform = parsePlatform(ua)
    return `<div style="margin-bottom:12px;padding:8px;background:#0d1117;border-radius:4px;">
      <div style="font-size:12px;color:#484f58;">
        ${type ? `<span class="pill ${type === 'bug' ? 'err' : 'success'}">${type}</span> ` : ''}
        ${email || 'anonymous'} · <span class="pill ${platform}">${platform}</span> · ${fmtTime(ts)}
      </div>
      <div style="margin-top:6px;">${msg}</div>
    </div>`
  }).join('')
}

loadAll()
</script>
</body>
</html>
