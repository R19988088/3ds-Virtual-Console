name: Build bannertool (Linux x86_64)

# Builds bannertool from carstene1ns/3ds-bannertool on Ubuntu and uploads
# the resulting binary as a tarball to the v0.1.0 release. Run manually
# from the Actions tab when a new release needs Linux support.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the binary to"
        required: true
        default: "v0.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpng-dev libogg-dev libvorbis-dev

      - name: Clone bannertool source
        run: git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git src

      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          file build/bannertool

      - name: Package
        run: |
          mkdir -p out
          cp src/build/bannertool out/bannertool
          chmod +x out/bannertool
          tar -czvf bannertool-linux-x86_64.tar.gz -C out bannertool
          ls -la bannertool-linux-x86_64.tar.gz
          shasum -a 256 bannertool-linux-x86_64.tar.gz

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" \
            bannertool-linux-x86_64.tar.gz \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: bannertool-linux-x86_64
          path: bannertool-linux-x86_64.tar.gz
