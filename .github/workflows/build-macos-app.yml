name: Build vcoven macOS app

on:
  workflow_dispatch:
    inputs:
      fbneo_run_id:
        description: "成功的 FBNeo 工作流运行号；留空则使用最近一次成功运行"
        required: false
        type: string
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "scripts/build-macos-app.sh"
      - ".github/workflows/build-macos-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out vcoven
        uses: actions/checkout@v4

      - name: Download FBNeo launcher
        env:
          GH_TOKEN: ${{ github.token }}
          FBNEO_RUN_ID: ${{ inputs.fbneo_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$FBNEO_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow build-fbneo.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          mkdir -p Sources/VcovenApp/Resources/arcade
          gh run download "$run_id" --name fbneo-3ds --dir Sources/VcovenApp/Resources/arcade
          test -s Sources/VcovenApp/Resources/arcade/fbneo_3ds.elf
          test -s Sources/VcovenApp/Resources/arcade/runtime.a
          test -s Sources/VcovenApp/Resources/arcade/SOURCE.txt
          test -s Sources/VcovenApp/Resources/arcade/SHA256SUMS
          for artifact in fbneo_3ds.elf runtime.a; do
            expected="$(awk -v name="$artifact" '$2 == name || $2 ~ ("/" name "$") { print $1 }' Sources/VcovenApp/Resources/arcade/SHA256SUMS)"
            actual="$(shasum -a 256 "Sources/VcovenApp/Resources/arcade/$artifact" | awk '{ print $1 }')"
            test -n "$expected"
            test "$actual" = "$expected"
          done
          grep -Eq '^[0-9a-f]{40}[[:space:]]+FBNeo source$' Sources/VcovenApp/Resources/arcade/SOURCE.txt

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-macos-app.sh dist

      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          test -x dist/vcoven.app/Contents/MacOS/vcoven
          test -f dist/vcoven.app/Contents/Resources/config_block.bin
          test -s dist/vcoven-macOS.dmg
          codesign --verify --deep --strict dist/vcoven.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: vcoven-macOS-arm64
          path: dist/vcoven-macOS.dmg
          if-no-files-found: error
