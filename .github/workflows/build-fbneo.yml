name: Build FBNeo 3DS core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - name: Check out vcoven
        uses: actions/checkout@v4

      - name: Check out pinned FBNeo source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/libretro/FBNeo.git work/FBNeo
          git -C work/FBNeo fetch --depth 1 origin 2fcb2628fbfd529806e75f3559a9d82758c8a5cc
          git -C work/FBNeo checkout --detach 2fcb2628fbfd529806e75f3559a9d82758c8a5cc

      - name: Verify build contract
        run: core-runtime/tests/verify-fbneo-contract.sh

      - name: Diagnose Cyclone assembler
        env:
          FBNEO_SOURCE: ${{ github.workspace }}/work/FBNeo
          CYCLONE_DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/core-runtime/dist/cyclone-diagnostic
          DEVKITARM_IMAGE: devkitpro/devkitarm:latest
        shell: bash
        run: |
          set -u
          core-runtime/scripts/diagnose-cyclone.sh
          status=$?
          test -s core-runtime/dist/cyclone-diagnostic/status.txt
          printf 'Cyclone diagnostic exit: %s\n' "$status"
          exit 0

      - name: Upload Cyclone diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-diagnostic-${{ github.run_id }}
          path: core-runtime/dist/cyclone-diagnostic
          if-no-files-found: warn

      - name: Build self-hosted FBNeo 3DS launcher
        env:
          FBNEO_SOURCE: ${{ github.workspace }}/work/FBNeo
          FBNEO_OUTPUT: ${{ github.workspace }}/core-runtime/dist/fbneo
          FBNEO_FAILURE_OUTPUT: ${{ github.workspace }}/core-runtime/dist/fbneo-build-diagnostic
        run: core-runtime/scripts/build-fbneo.sh

      - name: Upload FBNeo build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-build-diagnostic-${{ github.run_id }}
          path: core-runtime/dist/fbneo-build-diagnostic
          if-no-files-found: warn

      - name: Check launcher artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s core-runtime/dist/fbneo/fbneo_3ds.elf
          test "$(wc -c < core-runtime/dist/fbneo/fbneo_3ds.elf)" -lt $((16 * 1024 * 1024))
          header="$(arm-none-eabi-readelf -h core-runtime/dist/fbneo/fbneo_3ds.elf)"
          printf '%s\n' "$header" | grep -Eq '^ *Class:[[:space:]]+ELF32$'
          printf '%s\n' "$header" | grep -Eq '^ *Data:[[:space:]]+2.s complement, little endian$'
          printf '%s\n' "$header" | grep -Eq '^ *Machine:[[:space:]]+ARM$'
          printf '%s\n' "$header" | grep -Eq '^ *Flags:[[:space:]]+0x05000000, Version5 EABI'
          core-runtime/tests/verify-fbneo-artifact.sh \
            core-runtime/dist/fbneo/runtime.a \
            core-runtime/dist/fbneo/fbneo_3ds.elf \
            core-runtime/dist/fbneo/SOURCE.txt
          sha256sum core-runtime/dist/fbneo/* > core-runtime/dist/fbneo/SHA256SUMS

      - name: Upload FBNeo artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-3ds
          path: core-runtime/dist/fbneo
          if-no-files-found: error
