name: Build FBA 2012 core

on:
  workflow_dispatch:
  push:
    paths:
      - "core-runtime/**"
      - ".github/workflows/build-fba2012.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out vcoven
        uses: actions/checkout@v4

      - name: Check out pinned FBA source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/libretro/fbalpha2012.git work/fbalpha2012
          git -C work/fbalpha2012 fetch --depth 1 origin 0ce31536bef3162fe7e69ff5f555334ec4913cef
          git -C work/fbalpha2012 checkout --detach 0ce31536bef3162fe7e69ff5f555334ec4913cef

      - name: Verify CRC patch contract
        run: core-runtime/tests/verify-fba-crc-contract.sh

      - name: Build ARM static core
        shell: bash
        env:
          FBA_SOURCE: ${{ github.workspace }}/work/fbalpha2012
          FBA_OUTPUT: ${{ github.workspace }}/core-runtime/dist/fba2012
        run: core-runtime/scripts/build-fba2012.sh

      - name: Inspect core artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s core-runtime/dist/fba2012/runtime.a
          test "$(wc -c < core-runtime/dist/fba2012/runtime.a)" -gt 1024

      - name: Check out RetroArch 3DS frontend
        shell: bash
        run: |
          git clone --no-checkout https://github.com/libretro/RetroArch.git work/RetroArch
          git -C work/RetroArch fetch --depth 1 origin f3d2eedbfc58908d2c60cec9ed40e95c653cf261
          git -C work/RetroArch checkout --detach f3d2eedbfc58908d2c60cec9ed40e95c653cf261

      - name: Apply vcoven frontend patch
        run: git -C work/RetroArch apply --check --whitespace=error core-runtime/retroarch-vcoven.patch

      - name: Build complete FBA launcher
        env:
          RETROARCH_SOURCE: ${{ github.workspace }}/work/RetroArch
          FBA_CORE: ${{ github.workspace }}/core-runtime/dist/fba2012/runtime.a
          FBA_OUTPUT: ${{ github.workspace }}/core-runtime/dist/fba2012
        run: core-runtime/scripts/build-retroarch-fba.sh

      - name: Verify complete launcher artifact
        run: |
          set -euo pipefail
          test -s core-runtime/dist/fba2012/fba2012_3ds.elf
          test -s core-runtime/dist/fba2012/retroarch-fba-template.cia
          sha256sum core-runtime/dist/fba2012/fba2012_3ds.elf >> core-runtime/dist/fba2012/SHA256SUMS

      - name: Write artifact checksums
        run: sha256sum core-runtime/dist/fba2012/* > core-runtime/dist/fba2012/SHA256SUMS

      - name: Upload FBA core artifact
        uses: actions/upload-artifact@v4
        with:
          name: fba2012-crc-ignore-arm
          path: core-runtime/dist/fba2012
          if-no-files-found: error
