name: Build bannertool

# Builds bannertool from carstene1ns/3ds-bannertool for all supported
# platforms in parallel and uploads each binary as a tarball to the
# specified release. Run manually from the Actions tab when a new release
# needs prebuilt binaries.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the binaries to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            asset_name: bannertool-linux-x86_64.tar.gz
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y cmake build-essential libpng-dev libogg-dev libvorbis-dev
          - label: macos-arm64
            runner: macos-14
            asset_name: bannertool-macos-arm64.tar.gz
            install_deps: |
              brew install cmake libpng libogg libvorbis
          - label: macos-x86_64
            runner: macos-13
            asset_name: bannertool-macos-x86_64.tar.gz
            install_deps: |
              brew install cmake libpng libogg libvorbis

    steps:
      - name: Install build dependencies
        run: ${{ matrix.install_deps }}

      - name: Clone bannertool source
        run: git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git src

      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          file build/bannertool

      - name: Package
        run: |
          mkdir -p out
          cp src/build/bannertool out/bannertool
          chmod +x out/bannertool
          tar -czvf "${{ matrix.asset_name }}" -C out bannertool
          ls -la "${{ matrix.asset_name }}"
          shasum -a 256 "${{ matrix.asset_name }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" \
            "${{ matrix.asset_name }}" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset_name }}
